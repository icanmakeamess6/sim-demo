<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veeva simulator: Create a GDS Checklist</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2a21;--mut:#5b675f;--line:#d9ddd6;--g:#2d6a2e;--o:#f7941d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2620;--ink:#e8eee9;--mut:#9aa69e;--line:#33403a;--g:#6fbf71;--bad:#ff8a80}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:18px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--o);transition:width .3s}
.prompt{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--o);border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between;align-items:center;min-height:56px}
.prompt b{display:block}
.prompt .msg{color:var(--bad);font-weight:600;min-height:1.2em}
.prompt small{color:var(--mut);white-space:nowrap}
.stage{position:relative;line-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:default}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;cursor:pointer;border-radius:4px}
.hs.show{outline:3px solid var(--o);box-shadow:0 0 0 0 rgba(247,148,29,.6);animation:p 1.4s infinite}
@media (prefers-reduced-motion:reduce){.hs.show{animation:none}}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(247,148,29,0)}100%{box-shadow:0 0 0 0 rgba(247,148,29,0)}}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#1553b5;transform:translate(-50%,-50%);pointer-events:none}
.miss{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--bad);pointer-events:none;animation:f .6s forwards}
@keyframes f{to{opacity:0;transform:scale(1.8)}}
.done{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:10px}
.done.on{display:block}
.done h2{margin:0 0 6px;font-size:18px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-right:8px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
</style></head><body>
<div class="wrap">
<div class="top"><h1>Create a GDS Checklist in Veeva Vault</h1>
<div class="seg" role="group" aria-label="Mode"><button id="mShow" class="on">Show me</button><button id="mTry">Try me</button></div></div>
<div class="bar"><i id="bar"></i></div>
<div class="prompt"><div><b id="ttl"></b><span class="msg" id="msg"></span></div><small id="cnt"></small></div>
<div class="stage" id="stage"><img id="img" alt="Veeva Vault screenshot" draggable="false"></div>
<div class="done" id="done"><h2>Checklist created</h2><p id="sum"></p>
<button class="btn" id="again">Restart</button><button class="btn alt" id="tryit">Switch to Try me</button></div>
</div>

let n=0,mode="show",miss=0,stepMiss=0;
const $=id=>document.getElementById(id),st=$("stage"),img=$("img");
function render(){
 st.querySelectorAll(".hs,.dot,.miss").forEach(e=>e.remove());
 if(n>=S.length){img.src=IMGS[6];$("ttl").textContent="Done: GDS-Checklist-0000022 created in Draft status.";$("msg").textContent="";$("cnt").textContent="Complete";$("bar").style.width="100%";
  $("sum").textContent=miss===0?"No wrong clicks. Next, add GDS documents in the GDS Documents Selection section.":"Wrong clicks: "+miss+". Try again for a clean run.";$("done").classList.add("on");return}
 $("done").classList.remove("on");
 const s=S[n];img.src=IMGS[s.i];$("ttl").textContent=s.t;$("msg").textContent="";$("cnt").textContent="Step "+(n+1)+" of "+S.length;
 $("bar").style.width=(n/S.length*100)+"%";
 if(s.dot){const d=document.createElement("div");d.className="dot";d.style.left=s.dot[0]/W*100+"%";d.style.top=s.dot[1]/H*100+"%";st.appendChild(d)}
 const h=document.createElement("div");h.className="hs"+(mode==="show"?" show":"");h.id="hs";
 const [a,b,c,d]=s.b;h.style.cssText=`left:${a/W*100}%;top:${b/H*100}%;width:${(c-a)/W*100}%;height:${(d-b)/H*100}%`;
 h.onclick=e=>{e.stopPropagation();n++;stepMiss=0;render()};st.appendChild(h);
}
st.addEventListener("click",e=>{
 if(n>=S.length)return;
 const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const m=document.createElement("div");m.className="miss";m.style.left=x+"px";m.style.top=y+"px";st.appendChild(m);setTimeout(()=>m.remove(),700);
 miss++;stepMiss++;
 $("msg").textContent=" Not that one. "+(stepMiss>=2||mode==="show"?S[n].h:"Try again.");
 if(stepMiss>=2)$("hs").classList.add("show");
});
function setMode(m){mode=m;$("mShow").classList.toggle("on",m==="show");$("mTry").classList.toggle("on",m==="try");$("tryit").style.display=m==="try"?"none":"";n=0;miss=0;stepMiss=0;render()}
$("mShow").onclick=()=>setMode("show");$("mTry").onclick=()=>setMode("try");

render();
